[package]
name = "vectro_lib"
version = "2.0.0"
authors = ["Wesley Scholl <128409641+wesleyscholl@users.noreply.github.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
nalgebra = "0.32"
anyhow = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tempfile = "3.6"
criterion = { version = "0.5", features = ["async"] }
