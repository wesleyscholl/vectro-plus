name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # ── Linux x86_64 manylinux wheels ─────────────────────────────────────────
  linux-x86_64:
    name: Linux x86_64 wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --release
            --strip
            -i python3.8 python3.9 python3.10 python3.11 python3.12
          target: x86_64
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  # ── Linux aarch64 manylinux wheels ────────────────────────────────────────
  linux-aarch64:
    name: Linux aarch64 wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: >
            --release
            --strip
            -i python3.8 python3.9 python3.10 python3.11 python3.12
          target: aarch64
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-aarch64
          path: dist

  # ── macOS arm64 wheels ─────────────────────────────────────────────────────
  macos-arm64:
    name: macOS arm64 wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"
      - name: Build wheel
        run: maturin build --release --strip --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: dist

  # ── macOS x86_64 wheels ────────────────────────────────────────────────────
  macos-x86_64:
    name: macOS x86_64 wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"
      - name: Build wheel
        run: maturin build --release --strip --target x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-x86_64
          path: dist

  # ── Source distribution ────────────────────────────────────────────────────
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install maturin
        run: pip install "maturin>=1.5,<2.0"
      - name: Build sdist
        run: maturin sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # ── Publish to PyPI (trusted publishing via OIDC) ─────────────────────────
  publish:
    name: Publish to PyPI
    needs: [linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # Required for trusted publishing (no API token needed)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
